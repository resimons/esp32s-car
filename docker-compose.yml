version: "3.4"

services:

    mqtt-broker:
        image: eclipse-mosquitto:2
        container_name: mqtt-broker
        restart: always
        ports:
            - 1883:1883
        volumes:
            - ./mosquitto:/mosquitto/config
            - ./mosquitto/passwd_file:/mosquitto/passwd_file
            - ./mosquitto/data:/mosquitto/data
            - ./mosquitto/log:/mosquitto/log
        networks:
            - car-net

    node-red: 
        image: nodered/node-red:latest-minimal
        container_name: nodered
        restart: always
        ports:
            - 2880:1880
        environment:
            - NODE_RED_HTTP_ROOT=/nodered
        volumes:
            - ./nodered/data:/data
        networks:
            - car-net

networks:
    car-net:
        name: car-net
        driver: bridge
    other:
        name: other
        driver: bridge

