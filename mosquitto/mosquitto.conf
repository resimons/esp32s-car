persistence true
persistence_location /mosquitto/data/

log_dest stdout

#log_type websockets
log_type error
log_type warning
log_type notice
#log_type information
#log_type all

# Enable per-listener settings for distinct configurations on each listener
per_listener_settings true

##########################################
# Non-TLS Listener (Anonymous)
##########################################

# MQTT Default listener
listener 1883 0.0.0.0

# Additional security
password_file /mosquitto/passwd_file
allow_anonymous false
